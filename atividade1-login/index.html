<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login">

        <img src="img/alabama-jogo.png" alt="Logo Alabama" class="logo-img">
         <h1>Entrar na sua conta</h1>
         
        <form action="/enviar" method="post">

            <label for="usuario">E-mail ou Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu e-mail ou usuário">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">

            <a href="#" class="esqueceu">Esqueceu a senha?</a>

            <button class="botaoEntrar">Entrar</button>

            <p>Não tem conta? <a href="page.html">Cadastre-se</a></p>
        </form>
    </div>
</body>
</html>
